name: NeuroRadar company profiles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max companies (empty = all that need a profile)"
        required: false
        default: ""
      no_batch:
        description: "Direct calls instead of the Batches API (for small tests)"
        type: boolean
        default: false
      people_links_only:
        description: "Only refresh the people's LinkedIn links from company websites (no Claude calls)"
        type: boolean
        default: false
  schedule:
    # 1st of each month, after the daily run: refresh profiles older than 90 days
    - cron: "30 6 1 * *"

permissions:
  contents: write

concurrency:
  group: daily-update   # same queue as the daily job: never commit at the same time
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Claude runs on your Claude subscription through Claude Code (token from `claude setup-token`).
      # No ANTHROPIC_API_KEY here on purpose: nothing is billed as pay-as-you-go API usage.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_MAX_CALLS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code, headless Chromium and helpers
        run: |
          pip install -q anthropic playwright && python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
      - name: Build company profiles with Claude
        run: |
          ARGS="--wait-min 60"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ "${{ inputs.no_batch }}" = "true" ] && ARGS="$ARGS --no-batch"
          [ "${{ inputs.people_links_only }}" = "true" ] && ARGS="$ARGS --people-links"
          python3 scripts/enrich_llm.py $ARGS
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "neuroradar-bot"
          git config user.email "neuroradar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Company profiles $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
