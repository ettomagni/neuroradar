name: NeuroRadar daily update

on:
  schedule:
    # 05:00 UTC = 06:00 in Italy in winter (07:00 in summer)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK and headless Chromium
        run: pip install -q anthropic playwright && python -m playwright install --with-deps chromium

      - name: Weekly - find careers pages / ATS for unresolved companies (Mondays or manual run)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/find_careers.py
            python3 scripts/probe_ats.py
            python3 scripts/careers_llm.py --discover   # finds careers links only; each company re-checked at most monthly
          fi

      - name: Claude reads custom careers pages that changed
        run: python3 scripts/careers_llm.py

      - name: Fetch open positions and diff with yesterday
        run: python3 scripts/fetch_jobs.py

      - name: Claude extracts requirements of new roles
        run: python3 scripts/extract_requirements.py --wait-min 20

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "neuroradar-bot"
          git config user.email "neuroradar-bot@users.noreply.github.com"
          git add -A data  # job_texts.json and cache/ are gitignored
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
