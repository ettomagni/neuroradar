name: NeuroRadar daily update

on:
  schedule:
    # 05:00 UTC = 06:00 in Italy in winter (07:00 in summer)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Claude runs on your Claude subscription through Claude Code (token from `claude setup-token`).
      # No ANTHROPIC_API_KEY here on purpose: nothing is billed as pay-as-you-go API usage.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_MAX_CALLS: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code, headless Chromium and helpers
        run: |
          pip install -q anthropic playwright && python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Weekly - new companies on the start-up map, careers pages / ATS (Mondays or manual run)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/discover_companies.py || echo "Start-up map check skipped"   # new companies, no Claude calls
            python3 scripts/find_careers.py
            python3 scripts/probe_ats.py
            python3 scripts/careers_llm.py --discover   # finds careers links only; each company re-checked at most monthly
            python3 scripts/enrich_llm.py --missing-only --no-batch   # profiles (CEO, people's LinkedIn, city) for companies without one
          fi

      - name: Claude reads custom careers pages that changed
        run: python3 scripts/careers_llm.py

      - name: Fetch open positions and diff with yesterday
        run: python3 scripts/fetch_jobs.py

      - name: Claude extracts requirements of new roles
        run: python3 scripts/extract_requirements.py --wait-min 20

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "neuroradar-bot"
          git config user.email "neuroradar-bot@users.noreply.github.com"
          git add -A data  # job_texts.json and cache/ are gitignored
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
