<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroRadar</title>
  <meta name="description" content="Global map of neurotech startups, their open roles and news.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="globe" aria-label="Interactive globe of neurotech startups"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>NeuroRadar</h1>
        <p id="stats" class="muted">Loading…</p>
      </div>
    </div>
    <nav class="tabs" aria-label="View">
      <button id="tabGlobe" class="tab" aria-pressed="true">Globe</button>
      <button id="tabCompanies" class="tab" aria-pressed="false">Companies</button>
      <button id="tabJobs" class="tab" aria-pressed="false">Jobs</button>
      <button id="togglePanel" class="tab mobile-only" aria-expanded="true" aria-controls="panel">Filters</button>
    </nav>
  </header>

  <aside id="panel" class="panel">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search company or technology (e.g. EEG, tDCS)…" autocomplete="off">
    </label>

    <div class="section-title">Categories</div>
    <div id="chips" class="chips"></div>

    <div class="row">
      <select id="country" aria-label="Filter by country"></select>
      <button id="reset" class="ghost-btn small">Reset</button>
    </div>
    <label class="toggle"><input id="onlyHiring" type="checkbox"> Hiring companies only</label>

    <div class="section-title"><span id="resultCount"></span></div>
    <ul id="list" class="list"></ul>
  </aside>

  <section id="card" class="card" hidden aria-live="polite"></section>

  <section id="dash" class="board dash" hidden aria-label="Companies dashboard">
    <div class="board-head">
      <div class="dash-title">
        <h2>Companies</h2>
        <span id="dashCount" class="muted"></span>
      </div>
      <div class="board-filters">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="dashSearch" type="search" placeholder="Search name, technology, CEO, product, condition…" autocomplete="off">
        </label>
        <select id="dashSort" aria-label="Sort by">
          <option value="name">Sort: A–Z</option>
          <option value="roles">Sort: most open roles</option>
          <option value="newest">Sort: newest founded</option>
          <option value="oldest">Sort: oldest founded</option>
        </select>
        <label class="toggle"><input id="dashHiring" type="checkbox"> Hiring only</label>
        <button id="dashReset" class="ghost-btn small">Reset</button>
      </div>
      <div id="dashFilters" class="dash-filters"></div>
    </div>
    <div id="dashGrid" class="dash-grid"></div>
  </section>

  <section id="board" class="board" hidden aria-label="Jobs board">
    <div class="board-head">
      <h2>Open roles</h2>
      <div class="board-filters">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="boardSearch" type="search" placeholder="Role, company, city, skill, technology…" autocomplete="off">
        </label>
        <select id="boardRemote" aria-label="Work mode">
          <option value="">Anywhere</option>
          <option value="remote">Remote</option>
          <option value="hybrid">Hybrid</option>
        </select>
        <select id="boardSeniority" aria-label="Seniority"></select>
        <select id="boardDomain" aria-label="Area"></select>
        <label class="toggle"><input id="boardNew" type="checkbox"> New only</label>
      </div>
      <div class="board-sub">
        <span id="boardCount" class="muted"></span>
        <span id="boardCompany" hidden>· Company: <b id="boardCompanyName"></b>
          <button id="boardClearCompany" class="link-btn">clear</button></span>
      </div>
    </div>
    <ul id="boardList" class="board-list"></ul>
  </section>

  <dialog id="profile" class="profile" aria-labelledby="profileTitle">
    <button id="profileClose" class="close" aria-label="Close profile">✕</button>
    <div id="profileBody" class="profile-body"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
